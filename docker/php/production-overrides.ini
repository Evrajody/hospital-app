; Surcharges PHP appliquées en production via un montage de volume
; (docker-compose.prod.yml → /usr/local/etc/php/conf.d/zz-production-overrides.ini).
;
; Chargé APRÈS production.ini de l'image (ordre alphabétique du conf.d), donc
; les valeurs ci-dessous gagnent — et se modifient sans rebuild de l'image :
; il suffit d'éditer ce fichier puis `docker compose -f docker-compose.prod.yml restart app worker`.
;
; memory_limit=-1 : la génération PDF (dompdf) construit la cellmap complète des
; tableaux en mémoire ; les gros rapports dépassaient les 256 Mo de l'image et
; tombaient en « Allowed memory size exhausted ». Les rapports volumineux passent
; désormais par le worker (job asynchrone), mais on ne veut plus aucun plafond
; artificiel sur le rendu.
memory_limit=-1
