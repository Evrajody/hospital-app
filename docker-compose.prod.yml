services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    container_name: hospital-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Le .env de Laravel (monté depuis le host)
      - ./.env.production:/var/www/.env:ro
      # Storage persistant (uploads, logs, sessions, cache) — bind mount voisin du projet
      - ../hospital-storage:/var/www/storage
      # Dossier partagé avec nginx pour les fichiers statiques — bind mount voisin du projet
      - ../hospital-public:/var/www/public-shared
      - ./docker/entrypoint.prod.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - hospital-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'php -r ''echo "ok";'' || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Worker de file d'attente (exports de rapports asynchrones, jobs en base)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      network: host
    container_name: hospital-worker
    restart: unless-stopped
    working_dir: /var/www
    # On contourne l'entrypoint php-fpm de l'image pour lancer le worker.
    entrypoint: ["sh", "-c", "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs && exec php artisan queue:work --sleep=3 --tries=1 --max-time=3600 --memory=2048"]
    volumes:
      - ./.env.production:/var/www/.env:ro
      - ../hospital-storage:/var/www/storage
    networks:
      - hospital-network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: hospital-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
      - "443:443"
    volumes:
      # Dossier public synchronisé depuis le conteneur app — bind mount voisin du projet
      - ../hospital-public:/var/www/public:ro
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs/production-cert.pem:/etc/nginx/certs/production-cert.pem
      - ./docker/nginx/certs/production-key.pem:/etc/nginx/certs/production-key.pem
    networks:
      - hospital-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: hospital-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hospital_db}
      POSTGRES_USER: ${DB_USERNAME:-hospital_user}
      # Échoue explicitement si non défini (évite une base initialisée avec un mot de passe vide).
      # Lancer compose avec :  --env-file .env.production
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD non défini — lancez compose avec --env-file .env.production}
    volumes:
      # Données PostgreSQL et sauvegardes — bind mounts voisins du projet
      - ../hospital-db:/var/lib/postgresql/data
      - ../hospital-db-backups:/backups
    # Port NON exposé publiquement en prod
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_user -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hospital-network:
    driver: bridge
    external: true
