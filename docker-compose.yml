services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hospital-network
      - nexox
    depends_on:
      - db

  # Worker de file d'attente (exports de rapports asynchrones, jobs en base)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-worker
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["sh", "-c", "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs && exec php artisan queue:work --sleep=3 --tries=1 --max-time=3600 --memory=2048"]
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - hospital-network
      - nexox
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: hospital-nginx
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./:/var/www
      # pprod : on ne charge QUE la conf port 80 (TLS géré en amont par le proxy nexox,
      # pas de certificat ici). On évite ainsi production.conf (listen 443 ssl + certs).
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - hospital-network
      - nexox
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: hospital-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_db
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: password
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hospital-network
      - nexox

networks:
  hospital-network:
    driver: bridge
  nexox:
    driver: bridge
    external: true

volumes:
  dbdata:
    driver: local
