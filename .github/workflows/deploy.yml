name: Deploy Hospital App

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:
  # =========================================================================
  # Job 1 : Etat des lieux & Tests
  # =========================================================================
  etat-des-lieux:
    name: "Etat des lieux"
    runs-on: ubuntu-latest
    outputs:
      build_ok: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Info du commit
        run: |
          echo "## Etat des lieux" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branche** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auteur** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | ${{ github.event.head_commit.message }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Date** | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Verifier la structure du projet
        run: |
          echo "### Structure du projet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          CHECKS=()
          for f in Dockerfile.prod docker-compose.prod.yml Makefile composer.json package.json vite.config.js phpunit.xml; do
            if [ -f "$f" ]; then
              echo "  [OK] $f" >> $GITHUB_STEP_SUMMARY
              CHECKS+=("ok")
            else
              echo "  [MANQUANT] $f" >> $GITHUB_STEP_SUMMARY
            fi
          done

          for d in app config database routes resources public tests docker; do
            if [ -d "$d" ]; then
              echo "  [OK] $d/" >> $GITHUB_STEP_SUMMARY
            else
              echo "  [MANQUANT] $d/" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verifier la syntaxe PHP
        run: |
          echo "### Verification syntaxe PHP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "  - Erreur dans \`$file\`" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app config routes database -name "*.php" 2>/dev/null)

          if [ $ERRORS -eq 0 ]; then
            echo "Aucune erreur de syntaxe PHP" >> $GITHUB_STEP_SUMMARY
          else
            echo "**$ERRORS erreur(s) de syntaxe trouvee(s)**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build image Docker de production
        id: build
        run: |
          echo "### Build Docker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          docker build -f Dockerfile.prod -t hospital-app:test . 2>&1 | tail -5
          IMAGE_SIZE=$(docker image inspect hospital-app:test --format='{{.Size}}' | numfmt --to=iec-i)
          echo "Image Docker construite avec succes ($IMAGE_SIZE)" >> $GITHUB_STEP_SUMMARY

      - name: Test de demarrage des conteneurs
        run: |
          echo "### Test de demarrage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Creer un .env.production minimal pour le test
          cat > .env.production <<'EOF'
          APP_NAME=HospitalApp
          APP_ENV=production
          APP_KEY=base64:dGVzdGtleWZvcmNpdGVzdGtleWZvcmNp
          APP_DEBUG=false
          APP_URL=http://localhost:8080
          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_PORT=5432
          DB_DATABASE=hospital_db
          DB_USERNAME=hospital_user
          DB_PASSWORD=test_ci_password_123
          EOF

          # Exporter le mot de passe pour docker-compose
          export DB_PASSWORD=test_ci_password_123

          docker compose -f docker-compose.prod.yml up -d db
          echo "Attente du demarrage de PostgreSQL..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T db pg_isready -U hospital_user -d hospital_db > /dev/null 2>&1; then
              echo "  PostgreSQL pret en ${i}s" >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 1
          done

          docker compose -f docker-compose.prod.yml up -d
          echo "Attente du demarrage de l'application..."
          sleep 10

          # Verification des conteneurs
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker compose -f docker-compose.prod.yml ps >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          # Compter les conteneurs sains
          RUNNING=$(docker compose -f docker-compose.prod.yml ps --format json | grep -c '"running"' || true)
          TOTAL=$(docker compose -f docker-compose.prod.yml ps -q | wc -l)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$RUNNING/$TOTAL** conteneurs actifs" >> $GITHUB_STEP_SUMMARY

          # Verifier les healthchecks
          for i in $(seq 1 60); do
            HEALTHY=$(docker ps --filter "health=healthy" --format "{{.Names}}" | grep -c "hospital" || true)
            if [ "$HEALTHY" -ge 2 ]; then
              echo "Tous les healthchecks OK" >> $GITHUB_STEP_SUMMARY
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "**ATTENTION** : healthchecks non valides apres 60s" >> $GITHUB_STEP_SUMMARY
              docker compose -f docker-compose.prod.yml logs --tail=20 >> $GITHUB_STEP_SUMMARY 2>&1 || true
            fi
            sleep 1
          done

      - name: Nettoyage
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v --remove-orphans 2>/dev/null || true

  # =========================================================================
  # Job 2 : Deploiement sur le VPS
  # =========================================================================
  deploy:
    name: "Deploiement VPS"
    runs-on: ubuntu-latest
    needs: etat-des-lieux
    if: github.ref == 'refs/heads/main' && needs.etat-des-lieux.outputs.build_ok == 'true'
    environment: production
    steps:
      - name: Deployer via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=== Deploiement Hospital App ==="
            echo "Date : $(date)"
            echo ""

            # Aller dans le repertoire du projet
            cd ${{ secrets.VPS_APP_PATH || '~/hospital-app' }}

            # Pull les derniers changements
            echo "[1/5] Git pull..."
            git fetch origin main
            git reset --hard origin/main

            # Backup de la BDD
            echo "[2/5] Backup BDD..."
            if docker ps --format '{{.Names}}' | grep -q hospital-db; then
              mkdir -p backups
              docker exec hospital-db pg_dump -U hospital_user hospital_db > backups/pre-deploy_$(date +%Y%m%d_%H%M%S).sql 2>/dev/null || echo "Backup ignore"
              # Garder seulement les 5 derniers backups
              ls -t backups/pre-deploy_*.sql 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null || true
            fi

            # Build et deploiement
            echo "[3/5] Build des images..."
            docker compose -f docker-compose.prod.yml build

            echo "[4/5] Demarrage des conteneurs..."
            docker compose -f docker-compose.prod.yml up -d

            # Attendre que la BDD soit prete
            echo "Attente de la BDD..."
            for i in $(seq 1 30); do
              docker compose -f docker-compose.prod.yml exec -T db pg_isready -U hospital_user -d hospital_db > /dev/null 2>&1 && break
              sleep 1
            done

            echo "[5/5] Migrations et optimisation..."
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan storage:link 2>/dev/null || true

            echo ""
            echo "=== Etat des conteneurs ==="
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "=== Deploiement termine ==="

      - name: Rapport de deploiement
        if: always()
        run: |
          echo "## Deploiement VPS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.deploy.outcome }}" == "success" ] || [ "${{ job.status }}" == "success" ]; then
            echo "**Statut** : Deploye avec succes" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Statut** : Echec du deploiement" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Environnement** : production" >> $GITHUB_STEP_SUMMARY
          echo "**Date** : $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
